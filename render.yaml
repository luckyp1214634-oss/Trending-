# Render.com - is folder ko GitHub repo ka ROOT banao, phir deploy karo.
services:
  - type: web
    name: trading-assistant-mcp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    # Render PORT variable khud deta hai, server.py usi ko use karta hai.
    # Deploy ke baad endpoint hoga: https://<tumhara-naam>.onrender.com/mcp
